apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bulwark.fullname" . }}-secrets
  labels: {{- include "bulwark.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.password | quote }}
  objectstore-access-key: {{ .Values.objectstore.accessKey | quote }}
  objectstore-secret-key: {{ .Values.objectstore.secretKey | quote }}
  openbao-dev-root-token: {{ .Values.openbao.devRootToken | quote }}
  bulwark-api-token: {{ .Values.api.apiToken | default "dev-bulwark-api-token" | quote }}
  llm-api-key: {{ .Values.api.llm.apiKey | quote }}
  database-url-api: >-
    postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "bulwark.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}
  database-url-worker: >-
    postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "bulwark.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}
  database-url-migrate: >-
    postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "bulwark.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}
