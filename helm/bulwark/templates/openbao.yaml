apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bulwark.fullname" . }}-openbao
  labels: {{- include "bulwark.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "bulwark.selectorLabels" (dict "component" "openbao") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "bulwark.selectorLabels" (dict "component" "openbao") | nindent 8 }}
    spec:
      containers:
        - name: openbao
          image: {{ .Values.openbao.image }}
          ports: [{ containerPort: 8200 }]
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef: { name: {{ include "bulwark.fullname" . }}-secrets, key: openbao-dev-root-token }
          readinessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bulwark.fullname" . }}-openbao
  labels: {{- include "bulwark.labels" . | nindent 4 }}
spec:
  selector: {{- include "bulwark.selectorLabels" (dict "component" "openbao") | nindent 4 }}
  ports: [{ port: 8200, targetPort: 8200 }]
