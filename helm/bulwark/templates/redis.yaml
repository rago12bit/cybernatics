apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bulwark.fullname" . }}-redis
  labels: {{- include "bulwark.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "bulwark.selectorLabels" (dict "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "bulwark.selectorLabels" (dict "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bulwark.fullname" . }}-redis
  labels: {{- include "bulwark.labels" . | nindent 4 }}
spec:
  selector: {{- include "bulwark.selectorLabels" (dict "component" "redis") | nindent 4 }}
  ports: [{ port: 6379, targetPort: 6379 }]
