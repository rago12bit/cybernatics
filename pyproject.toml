[project]
name = "bulwark-scan"
version = "0.1.0"
description = "Unified security scanning platform: orchestration, normalization and prioritization over open-source scanners."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "celery[redis]>=5.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "reportlab>=4.0",
    "tomli>=2; python_version < '3.11'",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
bulwark = "cli.main:app"

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "black>=24", "mypy>=1.11", "httpx>=0.27", "jsonschema>=4", "pyyaml>=6", "anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["core*", "cli*", "api*"]

[tool.setuptools.package-data]
"core.taxonomy" = ["*.json"]
"core.rag" = ["corpus/*.jsonl", "corpus/*.json", "corpus/*.md"]

[tool.black]
extend-exclude = "(migrations/versions|tests/fixtures)"
target-version = ["py310"]
line-length = 100

[tool.ruff]
extend-exclude = ["migrations/versions", "tests/fixtures"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F811"]  # F811: shared pytest fixtures are re-imported by name
"core/export/*" = ["E501"]  # embedded CSS/HTML string literals
"core/rag/*" = ["E501"]  # prose-heavy design docstrings
"core/llm/*" = ["E501"]  # prompts and regexes
"core/reachability/*" = ["E501"]  # name tables
"core/ci/*" = ["E501"]  # markdown templates
"core/ignore.py" = ["E501"]
"scripts/*" = ["E501"]
"benchmarks/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument", "typer.Option",
    "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form",
]

[tool.mypy]
strict = true
files = ["core", "api"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "boto3.*", "botocore.*", "reportlab.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=api --cov-fail-under=80"
