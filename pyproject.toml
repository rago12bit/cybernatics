[project]
name = "bulwark"
version = "0.0.1"
description = "Unified security scanning platform: orchestration, normalization and prioritization over open-source scanners."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "black>=24", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["core*", "cli*"]

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov-fail-under=80"
