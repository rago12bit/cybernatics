# Bulwark full stack.  First run:  ./scripts/init-env.sh && docker compose --profile scanners build
# Then:                             docker compose up -d
name: bulwark

x-app-env: &app-env
  # The table-owning role. `migrate` runs as this (it must be able to create the app role below and
  # alter schema); `api` and `worker` override BULWARK_DATABASE_URL to the non-superuser app role
  # instead (ADR-0013) -- Postgres Row-Level Security does nothing against a superuser connection,
  # policies or not, so those two services must NOT use this URL once migration 0005 has run.
  BULWARK_DATABASE_URL: postgresql://bulwark:${POSTGRES_PASSWORD:?run scripts/init-env.sh}@postgres:5432/bulwark
  BULWARK_APP_DATABASE_URL: postgresql://bulwark_app:${APP_DB_PASSWORD:?run scripts/init-env.sh}@postgres:5432/bulwark
  # Bare values too (not just baked into the URLs above): migration 0005 reads APP_DB_PASSWORD
  # directly via os.environ to create/update the bulwark_app role. A value embedded only inside
  # another env var's string is not itself a separate environment variable a process can read.
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run scripts/init-env.sh}
  BULWARK_REDIS_URL: redis://redis:6379/0
  BULWARK_S3_ENDPOINT: http://objectstore:9000
  BULWARK_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/init-env.sh}
  BULWARK_S3_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/init-env.sh}
  BULWARK_API_TOKEN: ${BULWARK_API_TOKEN:?run scripts/init-env.sh}
  BULWARK_WORKDIR: ${BULWARK_WORKDIR:?run scripts/init-env.sh}
  # Structured JSON logs carry scan_id. Traces are exported only if you set an OTLP endpoint (see docs/observability.md).
  BULWARK_LOG_FORMAT: ${BULWARK_LOG_FORMAT:-json}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # GitHub App integration (Week 30, ADR-0017), all optional: unset -> the webhook endpoint 404s and
  # PR-comment posting is a no-op. `api` receives webhooks; `worker` posts the result comment once a
  # PR-triggered scan finishes -- both need these.
  BULWARK_GITHUB_APP_ID: ${BULWARK_GITHUB_APP_ID:-}
  BULWARK_GITHUB_APP_PRIVATE_KEY: ${BULWARK_GITHUB_APP_PRIVATE_KEY:-}
  BULWARK_GITHUB_WEBHOOK_SECRET: ${BULWARK_GITHUB_WEBHOOK_SECRET:-}
  # Envelope encryption (Week 47, plan §22.2): dev-mode OpenBao, see the `openbao` service below.
  # Unset in production env files; a real deployment points these at a real, unsealed OpenBao.
  BULWARK_OPENBAO_ADDR: http://openbao:8200
  BULWARK_OPENBAO_TOKEN: ${BULWARK_OPENBAO_TOKEN:?run scripts/init-env.sh}

x-app: &app
  build: { context: ., dockerfile: docker/app/Dockerfile }
  image: bulwark/app:dev
  environment: *app-env
  restart: unless-stopped

services:
  postgres:
    build: docker/postgres
    image: bulwark/postgres:16-pgvector
    environment:
      POSTGRES_USER: bulwark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      POSTGRES_DB: bulwark
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulwark"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine # 7.2 is the last BSD-licensed line; 7.4+ is RSALv2/SSPLv1 (docs/adr/0011-redis-license.md)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object store for raw scanner artifacts (ADR-007). Any S3 endpoint works.
  objectstore:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/init-env.sh}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/init-env.sh}
    volumes: [objectdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:9000/health || curl -s -o /dev/null http://localhost:9000/"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # Envelope encryption's key-encryption keys (Week 47, plan §22.2, ADR-0032). Dev mode ONLY: it
  # auto-unseals with a single, fixed root token and keeps everything in memory (nothing survives a
  # restart) -- exactly wrong for production, exactly right for local dev, where losing every KEK on
  # `docker compose down` is a non-issue. A real deployment runs OpenBao unsealed and persistent,
  # never with BAO_DEV_ROOT_TOKEN_ID.
  openbao:
    image: openbao/openbao:2.1
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BULWARK_OPENBAO_TOKEN:?run scripts/init-env.sh}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8200/v1/sys/health || exit 1"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # The worker launches sandboxed scanner containers. It reaches the Docker daemon ONLY through
  # this proxy, which exposes just the API calls `docker run` needs (see ADR-002 amendment).
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 1
      VOLUMES: 1
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && bulwark kb load --if-empty"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-config", "api/log_config.json", "--no-access-log"]
    environment:
      <<: *app-env
      # Non-superuser role: this is the connection Postgres RLS (ADR-0013) actually enforces against.
      # (Compose variable substitution can't reference another key's already-substituted value, so
      # this repeats the same construction as BULWARK_APP_DATABASE_URL above rather than pointing at it.)
      BULWARK_DATABASE_URL: postgresql://bulwark_app:${APP_DB_PASSWORD:?run scripts/init-env.sh}@postgres:5432/bulwark
      # Optional AI suggestions (off by default). Only the API needs the key, never the worker.
      # Enabling sends finding text and code snippets to your model provider: see docs/llm-remediation.md.
      BULWARK_LLM_ENABLED: ${BULWARK_LLM_ENABLED:-0}
      BULWARK_LLM_API_KEY: ${BULWARK_LLM_API_KEY:-}
      BULWARK_LLM_MODEL: ${BULWARK_LLM_MODEL:-claude-sonnet-5}
      # The verified-fix agent (plan §21.2, --profile fixagent): unset (the default) means starting
      # a run 503s with "could not start the verified-fix workflow" rather than the API failing to
      # boot -- Temporal is opt-in infrastructure, not a hard dependency of the base stack.
      BULWARK_TEMPORAL_ADDRESS: ${BULWARK_TEMPORAL_ADDRESS:-temporal:7233}
      # Defaults to core/config.py's own default (http://localhost:3000), which doesn't match this
      # compose file's web service below -- published on 3010 here, not 3000 (see that service's own
      # comment). Without this, the browser's CORS preflight to the API is rejected because the web
      # UI's actual origin isn't in the allow-list, which the sign-in screen reports as "Cannot reach
      # the Bulwark API" (a CORS rejection looks like a network failure to fetch()).
      BULWARK_CORS_ORIGINS: ${BULWARK_CORS_ORIGINS:-http://localhost:3010}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["${BULWARK_WORKDIR}:${BULWARK_WORKDIR}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
      openbao: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 20

  worker:
    <<: *app
    command: ["celery", "-A", "core.tasks", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-P", "threads", "-c", "4", "-l", "info"]  # -B: embedded beat for housekeeping (run ONE worker with -B)
    environment:
      <<: *app-env
      # Non-superuser role, same reasoning as the api service above (ADR-0013).
      BULWARK_DATABASE_URL: postgresql://bulwark_app:${APP_DB_PASSWORD:?run scripts/init-env.sh}@postgres:5432/bulwark
      DOCKER_HOST: tcp://socket-proxy:2375
      BULWARK_METRICS_ADDR: 0.0.0.0 # reachable by Prometheus on the compose network; not published to the host
    # Same path inside and outside: scanner containers bind-mount these via the host daemon.
    volumes: ["${BULWARK_WORKDIR}:${BULWARK_WORKDIR}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
      openbao: { condition: service_healthy }
      socket-proxy: { condition: service_started }

  # ---- optional: the verified-fix agent (docker compose --profile fixagent up -d) --------------
  # Temporal (plan §21.2, ADR-0027): the first Temporal workflow in this codebase (everything else
  # uses Celery, above). Points at the SAME Postgres instance as `bulwark` itself, in separate
  # databases (`temporal`/`temporal_visibility`) auto-setup creates on first run -- one fewer
  # container than a dedicated Temporal Postgres, and this project already runs one.
  temporal:
    profiles: [fixagent]
    image: temporalio/auto-setup:1.24.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: bulwark
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # The Temporal Web UI (plan §21.2: "visible in Temporal's UI") -- operator-facing only, not part
  # of the product's own web app.
  temporal-ui:
    profiles: [fixagent]
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8081
    ports: ["127.0.0.1:8081:8080"]
    depends_on: [temporal]
    restart: unless-stopped

  fixagent-worker:
    <<: *app
    profiles: [fixagent]
    command: ["python", "-m", "core.fixagent.worker"]
    environment:
      <<: *app-env
      BULWARK_DATABASE_URL: postgresql://bulwark_app:${APP_DB_PASSWORD:?run scripts/init-env.sh}@postgres:5432/bulwark
      BULWARK_TEMPORAL_ADDRESS: temporal:7233
      DOCKER_HOST: tcp://socket-proxy:2375 # for the opt-in test-execution sandbox (core/fixagent/sandbox.py)
      # Same variables Week 41's gateway already reads (core/llm/gateway.py) -- the fix agent's own
      # tool-calling loop is hosted (Anthropic) only for now (ADR-0027), so at minimum
      # BULWARK_LLM_ENABLED/BULWARK_LLM_API_KEY must be set for verified-fix runs to do anything.
      BULWARK_LLM_ENABLED: ${BULWARK_LLM_ENABLED:-0}
      BULWARK_LLM_API_KEY: ${BULWARK_LLM_API_KEY:-}
      BULWARK_LLM_MODEL: ${BULWARK_LLM_MODEL:-claude-sonnet-5}
      BULWARK_GITHUB_APP_ID: ${BULWARK_GITHUB_APP_ID:-}
      BULWARK_GITHUB_APP_PRIVATE_KEY: ${BULWARK_GITHUB_APP_PRIVATE_KEY:-}
    volumes: ["${BULWARK_WORKDIR}:${BULWARK_WORKDIR}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_started }
      socket-proxy: { condition: service_started }

  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: ${BULWARK_PUBLIC_API_URL:-http://localhost:8000}
    image: bulwark/web:dev
    # 3000 is taken by an unrelated local process on this machine; published on 3010 instead.
    ports: ["127.0.0.1:3010:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Scanner images are built (not run) here so one command builds the whole system.
  scanner-bandit:
    profiles: [scanners]
    build: docker/bandit
    image: bulwark/bandit:1.7.10
  scanner-semgrep:
    profiles: [scanners]
    build: docker/semgrep
    image: bulwark/semgrep:1.90.0
  scanner-trivy:
    profiles: [scanners]
    build: docker/trivy
    image: bulwark/trivy:0.55.2
  scanner-osv:
    profiles: [scanners]
    build: docker/osv-scanner
    image: bulwark/osv-scanner:2.6.0
  scanner-grype:
    profiles: [scanners]
    build: docker/grype
    image: bulwark/grype:0.119.0
  scanner-checkov:
    profiles: [scanners]
    build: docker/checkov
    image: bulwark/checkov:3.3.19
  scanner-gosec:
    profiles: [scanners]
    build: docker/gosec
    image: bulwark/gosec:2.29.0
  scanner-dockle:
    profiles: [scanners]
    build: docker/dockle
    image: bulwark/dockle:0.4.15
  scanner-syft:
    profiles: [scanners]
    build: docker/syft
    image: bulwark/syft:1.52.0
  egress-sidecar:
    profiles: [scanners]
    build: docker/egress-sidecar
    image: bulwark/egress-sidecar:1

  # ---- optional: metrics, dashboard and traces (docker compose --profile observability up -d) ----
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [worker]
    restart: unless-stopped
  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"] # UI. OTLP (4318) stays on the compose network.
    restart: unless-stopped
  grafana:
    profiles: [observability]
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin} # local use only: the port is bound to localhost
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bulwark.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, jaeger]
    restart: unless-stopped

volumes:
  pgdata:
  objectdata:
