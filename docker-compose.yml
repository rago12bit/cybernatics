# Bulwark full stack.  First run:  ./scripts/init-env.sh && docker compose --profile scanners build
# Then:                             docker compose up -d
name: bulwark

x-app-env: &app-env
  BULWARK_DATABASE_URL: postgresql://bulwark:${POSTGRES_PASSWORD:?run scripts/init-env.sh}@postgres:5432/bulwark
  BULWARK_REDIS_URL: redis://redis:6379/0
  BULWARK_S3_ENDPOINT: http://objectstore:9000
  BULWARK_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/init-env.sh}
  BULWARK_S3_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/init-env.sh}
  BULWARK_API_TOKEN: ${BULWARK_API_TOKEN:?run scripts/init-env.sh}
  BULWARK_WORKDIR: ${BULWARK_WORKDIR:?run scripts/init-env.sh}

x-app: &app
  build: { context: ., dockerfile: docker/app/Dockerfile }
  image: bulwark/app:dev
  environment: *app-env
  restart: unless-stopped

services:
  postgres:
    build: docker/postgres
    image: bulwark/postgres:16-pgvector
    environment:
      POSTGRES_USER: bulwark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      POSTGRES_DB: bulwark
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulwark"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object store for raw scanner artifacts (ADR-007). Any S3 endpoint works.
  objectstore:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/init-env.sh}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/init-env.sh}
    volumes: [objectdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:9000/health || curl -s -o /dev/null http://localhost:9000/"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # The worker launches sandboxed scanner containers. It reaches the Docker daemon ONLY through
  # this proxy, which exposes just the API calls `docker run` needs (see ADR-002 amendment).
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 1
      VOLUMES: 1
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["${BULWARK_WORKDIR}:${BULWARK_WORKDIR}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 20

  worker:
    <<: *app
    command: ["celery", "-A", "core.tasks", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-P", "threads", "-c", "4", "-l", "info"]  # -B: embedded beat for housekeeping (run ONE worker with -B)
    environment:
      <<: *app-env
      DOCKER_HOST: tcp://socket-proxy:2375
    # Same path inside and outside: scanner containers bind-mount these via the host daemon.
    volumes: ["${BULWARK_WORKDIR}:${BULWARK_WORKDIR}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
      socket-proxy: { condition: service_started }

  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_API_URL: ${BULWARK_PUBLIC_API_URL:-http://localhost:8000}
    image: bulwark/web:dev
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Scanner images are built (not run) here so one command builds the whole system.
  scanner-bandit:
    profiles: [scanners]
    build: docker/bandit
    image: bulwark/bandit:1.7.10
  scanner-semgrep:
    profiles: [scanners]
    build: docker/semgrep
    image: bulwark/semgrep:1.90.0
  scanner-trivy:
    profiles: [scanners]
    build: docker/trivy
    image: bulwark/trivy:0.55.2
  scanner-osv:
    profiles: [scanners]
    build: docker/osv-scanner
    image: bulwark/osv-scanner:2.6.0

volumes:
  pgdata:
  objectdata:
