# mTLS for every network connection (Week 47 task 3, plan §22.2, ADR-0033): a client must present
# a certificate signed by certs/ca.crt, and that certificate's CN must exactly match the Postgres
# role it connects as (Postgres's own clientcert=verify-full behavior, not something enforced in
# application code). `local` (Unix socket) stays trust-only: only processes already inside this
# container can reach that socket at all, and it's what docker-entrypoint.sh's own first-boot setup
# and `pg_isready` use.
local   all             all                                     trust

# Temporal's own auto-setup image (docker-compose.yml's `temporal` service, plan §21.2's opt-in
# fixagent profile) is a third-party image with no support for presenting a client certificate --
# it is not one of Bulwark's own services this ADR's mTLS covers. It connects as its own dedicated
# role, `temporal_svc` (created once at first init by docker/postgres/init-temporal-role.sql, never
# a member of bulwark_app), carved out by role name ahead of the catch-all cert rule below (pg_hba
# uses first match, so this MUST stay above it). Every role Bulwark's own code connects as --
# bulwark, bulwark_api, bulwark_worker, bulwark_fixagent -- keeps the cert requirement with no
# exceptions; only fully replacing the third-party Temporal image would close this one gap.
hostssl all             temporal_svc    0.0.0.0/0               scram-sha-256
hostssl all             temporal_svc    ::/0                    scram-sha-256

hostssl all             all             0.0.0.0/0               cert clientcert=verify-full
hostssl all             all             ::/0                    cert clientcert=verify-full
