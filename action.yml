name: Bulwark security scan
description: >
  Runs Bulwark (Bandit, Semgrep, Gitleaks, Trivy, OSV-Scanner) on your repository, uploads SARIF to GitHub
  Code Scanning, comments the findings a pull request introduces, and can fail the check by severity.
author: Bulwark
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    default: "."
  tools:
    description: Comma-separated scanners.
    default: "bandit,semgrep,gitleaks,trivy,osv-scanner"
  fail-on:
    description: >
      Fail the check when a finding at or above this severity exists (none, low, medium, high, critical).
      On pull requests this counts only findings the change introduced.
    default: "high"
  upload-sarif:
    description: "Upload results to GitHub Code Scanning (needs `security-events: write`)."
    default: "true"
  comment:
    description: "Comment the new findings on pull requests (needs `pull-requests: write`; not possible on forks)."
    default: "true"
  sbom:
    description: >
      Also write a CycloneDX 1.6 SBOM (output sbom-file; upload it with actions/upload-artifact if
      you want to keep it). Also joins each finding's real package license onto it before policy
      evaluation (plan §20.5), so a policy-file testing issue.license works with no extra input.
    default: "false"
  compare-base:
    description: On pull requests, also scan the base commit so only new findings are reported and gated.
    default: "true"
  policy-file:
    description: >
      A Rego policy file (plan §20.4), relative to the workspace. Its data.gate.pull_request.deny
      drives the check in addition to fail-on -- a policy can fail the check for a reason severity
      alone never would (a leaked secret, a denylisted license, an expired risk acceptance), and
      cannot loosen fail-on's own result. Leave empty to skip policy evaluation entirely.
    default: ""
  cache:
    description: >
      Content-addressed result cache (plan §20.1), persisted across runs with actions/cache: files
      unchanged since a previous run are not rescanned. This is what keeps compare-base's extra
      base-commit scan cheap on repeat runs, and is what "under 60 seconds for a typical pull
      request" (the target this feature is measured against) actually depends on.
    default: "true"
  github-token:
    description: Token used for the pull-request comment.
    default: ${{ github.token }}
  python-version:
    description: Python used to run Bulwark.
    default: "3.12"

outputs:
  new-findings:
    description: Findings the change introduced (or all findings when there is no baseline).
    value: ${{ steps.compare.outputs.new-findings }}
  total-findings:
    description: All findings in the scanned tree.
    value: ${{ steps.compare.outputs.total-findings }}
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.compare.outputs.sarif-file }}
  policy-violations:
    description: Count of policy denials (plan §20.4; empty when policy-file was not set).
    value: ${{ steps.compare.outputs.policy-violations }}
  sbom-file:
    description: Path of the CycloneDX SBOM (empty unless `sbom` is true).
    value: ${{ steps.sbom.outputs.sbom-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Bulwark
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install --quiet "$ACTION_PATH"

    - name: Build scanner images
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/action/build-images.sh"

    - name: Install OPA (plan §20.4 -- only fetched when a policy-file is actually configured)
      if: ${{ inputs.policy-file != '' }}
      shell: bash
      run: |
        set -euo pipefail
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m)"
        [ "$arch" = "x86_64" ] && arch="amd64"
        [ "$arch" = "aarch64" ] && arch="arm64"
        curl -sL -o /usr/local/bin/opa "https://openpolicyagent.org/downloads/v1.21.0/opa_${os}_${arch}_static"
        chmod +x /usr/local/bin/opa
        opa version

    - name: Restore the result cache
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bulwark-result-cache
        key: bulwark-result-cache-${{ runner.os }}-${{ github.run_id }}
        restore-keys: bulwark-result-cache-${{ runner.os }}-

    - name: Scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        TOOLS: ${{ inputs.tools }}
        COMPARE_BASE: ${{ inputs.compare-base }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CACHE: ${{ inputs.cache }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        ignore_args=()
        cache_args=()
        # Same path as the restore/save steps' `path: ~/.bulwark-result-cache` -- $HOME, not a
        # literal `~`, since bash only expands `~` when it appears directly in a word it parses,
        # not inside an already-set environment variable's value.
        [ "$CACHE" = "true" ] && cache_args=(--cache-dir "$HOME/.bulwark-result-cache")
        pr=false
        if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
          pr=true
          # The ignore file comes from the BASE commit: a change must not be able to hide its own
          # findings by adding a .bulwarkignore. If the base cannot be fetched, nothing is ignored.
          : > "$RUNNER_TEMP/ignore"
          if git fetch --quiet --depth=1 origin "$BASE_SHA"; then
            git show "$BASE_SHA:${SCAN_PATH%/}/.bulwarkignore" > "$RUNNER_TEMP/ignore" 2>/dev/null || : > "$RUNNER_TEMP/ignore"
          else
            echo "::warning::Could not fetch the base commit; ignore rules and the baseline are unavailable."
            pr=false
          fi
          ignore_args=(--ignore-file "$RUNNER_TEMP/ignore")
        fi
        bulwark scan "$SCAN_PATH" --tools "$TOOLS" --format json ${ignore_args[@]+"${ignore_args[@]}"} ${cache_args[@]+"${cache_args[@]}"} --output "$RUNNER_TEMP/head.json"
        if [ "$pr" = true ] && [ "$COMPARE_BASE" = "true" ]; then
          # A failed baseline is not fatal: the comment then says every finding is listed. The
          # result cache (when enabled) is what keeps this second, otherwise-redundant full scan of
          # the base commit cheap: on any run after the first, the base commit's files were most
          # likely already scanned (as some prior run's HEAD), so this becomes almost entirely
          # cache hits rather than a second real scan.
          if git worktree add --quiet --detach "$RUNNER_TEMP/base" "$BASE_SHA" \
             && bulwark scan "$RUNNER_TEMP/base/$SCAN_PATH" --tools "$TOOLS" --format json ${ignore_args[@]+"${ignore_args[@]}"} ${cache_args[@]+"${cache_args[@]}"} --output "$RUNNER_TEMP/base.json"; then
            echo "baseline scan done"
          else
            echo "::warning::Could not scan the base commit; reporting all findings instead of only new ones."
            rm -f "$RUNNER_TEMP/base.json"
          fi
        fi

    - name: Generate SBOM
      id: sbom
      if: ${{ inputs.sbom == 'true' }}
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      run: |
        bulwark sbom "$SCAN_PATH" --output "$RUNNER_TEMP/sbom.cdx.json"
        echo "sbom-file=$RUNNER_TEMP/sbom.cdx.json" >> "$GITHUB_OUTPUT"

    - name: Compare and gate
      id: compare
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        POLICY_FILE: ${{ inputs.policy-file }}
        SBOM_FILE: ${{ steps.sbom.outputs.sbom-file }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        args=(ci compare --head "$RUNNER_TEMP/head.json" --fail-on "$FAIL_ON"
              --label "$GITHUB_REPOSITORY" --run-url "$RUN_URL"
              --sarif-out "$RUNNER_TEMP/bulwark.sarif" --comment-out "$RUNNER_TEMP/comment.md"
              --summary-out "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT")
        [ -f "$RUNNER_TEMP/base.json" ] && args+=(--base "$RUNNER_TEMP/base.json")
        [ -n "$POLICY_FILE" ] && args+=(--policy "$GITHUB_WORKSPACE/$POLICY_FILE")
        # SBOM_FILE (plan §20.5) is only set when `sbom: true` -- it joins each finding's real
        # package license onto it, so a --policy checking issue.license works with no extra input.
        [ -n "$SBOM_FILE" ] && args+=(--sbom "$SBOM_FILE")
        bulwark "${args[@]}"
        rc=$?
        echo "gate-exit=$rc" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$RUNNER_TEMP/bulwark.sarif" >> "$GITHUB_OUTPUT"
        # 1 means "threshold or policy breached" (both are folded into the same exit code by
        # `bulwark ci compare`): reported after the upload and comment steps. 2 is a real error
        # (including a syntactically invalid policy file).
        [ "$rc" -le 1 ] || exit "$rc"

    - name: Upload SARIF to Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.compare.outputs.sarif-file != '' }}
      continue-on-error: true # forks and missing permissions must not hide the gate result
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.compare.outputs.sarif-file }}
        category: bulwark

    - name: Comment on the pull request
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment == 'true' && steps.compare.outputs.sarif-file != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        API_URL: ${{ github.api_url }}
      run: |
        bulwark ci comment --body "$RUNNER_TEMP/comment.md" --repo "$GITHUB_REPOSITORY" \
          --pr "$PR_NUMBER" --api-url "$API_URL"

    - name: Save the result cache
      if: ${{ always() && inputs.cache == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bulwark-result-cache
        key: bulwark-result-cache-${{ runner.os }}-${{ github.run_id }}

    - name: Enforce the gate
      if: ${{ steps.compare.outputs.gate-exit == '1' }}
      shell: bash
      run: |
        echo "::error::Bulwark found findings at or above the configured severity threshold, or a policy violation (plan §20.4). See the pull-request comment or job summary for details."
        exit 1
