name: CI
on:
  # Pushes to main only: a pull request's branch is tested by its pull_request run, and running
  # both for every Dependabot PR doubled the jobs queued for the account's limited runners.
  push:
    branches: [main]
  pull_request:

# A PR's newer commit supersedes the run on its older one; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default (Week 48 task 4, plan §22.3, OpenSSF Scorecard's Token-Permissions check):
# no job here pushes commits, creates releases, or comments on anything -- read-only is sufficient
# for every one of them, matching .github/workflows/bulwark.yml's own existing precedent.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # xmlsec1: SAML signature checks, so tests/unit/test_saml.py's attack tests run, not skip.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1
      - run: pip install -e ".[dev]"
      # A real third-party-shaped package, installed exactly as a plugin author's own `pip install`
      # would be (Week 51 task 1, plan §23) -- proves core.plugins.registry.discover_plugins() finds
      # it via a genuine entry point in CI's own fresh environment, not only in a dev venv that
      # happened to have it installed already. See examples/bulwark-plugin-demo/README.md.
      - run: pip install -e examples/bulwark-plugin-demo --no-deps
      - run: ruff check .
      - run: black --check .
      - run: mypy
      - run: docker build -t bulwark/bandit:1.7.10 docker/bandit
      - run: docker build -t bulwark/semgrep:1.90.0 docker/semgrep
      - run: docker build -t bulwark/opengrep:1.30.0 docker/opengrep
      - run: docker build -t bulwark/trivy:0.55.2 docker/trivy
      - run: docker build -t bulwark/osv-scanner:2.6.0 docker/osv-scanner
      - run: docker build -t bulwark/syft:1.52.0 docker/syft
      - run: docker build -f docker/ingest-parser/Dockerfile -t bulwark/ingest-parser:1 .
      - run: docker build -t bulwark/egress-sidecar:1 docker/egress-sidecar
      - run: docker pull ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      - name: Install OPA (plan §20.4 -- policy-as-code)
        run: |
          curl -sL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.21.0/opa_linux_amd64_static
          echo "5eef70644868bb04d0556bcc795ee42f2ab379e73f51d1bfa30f83e1305bc9b9  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa
          opa version
      - run: opa test core/policy/starter
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs,dev]" # dev: the freshness test below needs pytest
      # --strict: a link from docs/ to a file outside it (../SECURITY.md, ../benchmarks/...) works on
      # GitHub but 404s on the published site, so such links are absolute GitHub URLs and any new one
      # fails here, as does a missing anchor.
      - run: mkdocs build --strict
      - run: python -m pytest tests/unit/test_api_docs_freshness.py --no-cov

  zap-baseline:
    # DAST against itself (Week 48 task 2, plan §22.3): the platform running its own baseline
    # scanning tooling against its own web app, in CI, on every push and pull request -- not just
    # something it offers customers. The demo-only build (no API, ADR: web/fly.toml's "public
    # sample site") is the right target: ZAP only needs a real running app to crawl passively, and
    # this one needs no backend to stand up. `-I` treats WARN-level findings as informational for
    # the exit code (only a real FAIL fails the job) -- verified live against this exact build
    # before being written here: 0 FAIL, 4 disclosed WARN categories, all scoped to /_next/static
    # assets that intentionally skip per-request middleware for performance (proxy.ts's own
    # matcher), not unaddressed gaps on any real page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_ONLY: "1"
      - working-directory: web
        run: npx next start -p 3000 &
        env:
          NEXT_PUBLIC_DEMO_ONLY: "1"
      - name: Wait for the app to come up
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && exit 0
            sleep 1
          done
          echo "app never came up" >&2
          exit 1
      - run: mkdir -p "$RUNNER_TEMP/zap"
      - name: ZAP baseline scan
        run: >-
          docker run --rm -v "$RUNNER_TEMP/zap:/zap/wrk:rw" --network host
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py
          -t http://localhost:3000 -r zap-report.html -J zap-report.json -I
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-baseline-report
          path: ${{ runner.temp }}/zap/zap-report.html

  e2e:
    # Playwright end-to-end tests for journeys J1 and J3, plus visual regression snapshots (plan
    # §31's quality gates). Real Next.js app + real FastAPI backend (see scripts/e2e_server.py's
    # module docstring for the one thing that's stubbed -- actual scanner containers -- and why),
    # not mocked HTTP. Needs both toolchains: Python for scripts/e2e_server.py, Node for Playwright
    # itself and the app it drives.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e
        env:
          E2E_PYTHON: python
      # The production build under the production CSP: `npm run e2e` drives `next dev`, whose
      # policy allows what production forbids (tests-e2e-csp/csp.spec.ts says why that matters).
      - working-directory: web
        run: npm run e2e:csp
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tier2-adapters:
    # Heavier scanner images (Grype bakes in its vulnerability database): built separately from the main job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: docker build -t bulwark/grype:0.119.0 docker/grype
      - run: docker build -t bulwark/nuclei:3.11.1 docker/nuclei
      - run: docker build -t bulwark/checkov:3.3.19 docker/checkov
      - run: docker build -t bulwark/gosec:2.29.0 docker/gosec
      - run: docker build -t bulwark/dockle:0.4.15 docker/dockle
      - run: docker build -t bulwark/trivy:0.55.2 docker/trivy
      - run: docker build -t bulwark/osv-scanner:2.6.0 docker/osv-scanner
      - run: pytest tests/unit/test_tier2_adapters.py tests/integration/test_tier2_docker.py --no-cov

  tenancy-rls:
    # The automated cross-tenant leak test ADR-0013 committed to running on every pull request
    # (Week 29 backfill): real Postgres, real Row-Level Security -- the `test` job's SQLite tests
    # only cover application-level filtering, which is belt-and-suspenders, not the real guarantee.
    # pgvector's image, not plain postgres: migration 0002 needs the `vector` extension to exist.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bulwark
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: bulwark
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install OPA (test_rules_rls_docker.py checks rule conditions with it)
        run: |
          curl -sL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.21.0/opa_linux_amd64_static
          echo "5eef70644868bb04d0556bcc795ee42f2ab379e73f51d1bfa30f83e1305bc9b9  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa
      - name: Migrate as the table-owning role (creates the per-service roles, grants, RLS policies)
        env:
          BULWARK_DATABASE_URL: postgresql://bulwark:ci-owner-password@localhost:5432/bulwark
          APP_DB_PASSWORD: ci-app-password
        run: alembic upgrade head
      - name: Cross-tenant leak test, connected as bulwark_worker -- exactly like the real worker
        # bulwark_app itself is NOLOGIN as of migration 0020 (Week 47 task 3, ADR-0033); its
        # privileges are inherited by bulwark_worker (and bulwark_api/bulwark_fixagent), which is
        # what every real connection uses now. This CI job has no custom mTLS Postgres image or
        # certs, so it authenticates by the same password migration 0020 also sets on these roles
        # for exactly this reason -- production's pg_hba.conf never checks it, only the client cert.
        #
        # Every tests/integration/*_rls_docker.py file, by glob rather than listed one by one: two
        # of these (test_maintenance_rls_docker.py, test_asset_verification_rls_docker.py) were
        # previously verified locally only and silently never ran here -- found while adding this
        # week's own plugin-allowlist RLS test (Week 51 task 1, plan §23), fixed so a real RLS
        # regression in any of them is actually caught on every PR, not just whenever someone
        # happens to re-run them by hand.
        env:
          BULWARK_RLS_TEST_DATABASE_URL: postgresql+psycopg://bulwark_worker:ci-app-password@localhost:5432/bulwark
        run: pytest tests/integration/*_rls_docker.py --no-cov

  licenses:
    # Regenerates THIRD_PARTY_LICENSES.md (kept as an artifact) and fails on an unknown or denied license.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[llm,otel]"
      - run: python scripts/gen-licenses.py --check
      - run: python scripts/gen-licenses.py --out "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: ${{ runner.temp }}/THIRD_PARTY_LICENSES.md

  dependency-audit:
    # Known-vulnerability scanning of Bulwark's OWN dependencies (Week 48 task 3, plan §22.3, ASVS
    # V10): the platform scans other projects' dependencies for CVEs but had no equivalent check on
    # its own until this -- found during an ASVS self-review, alongside .github/dependabot.yml for
    # the update side of the same gap. Live-verified against this exact dependency set before being
    # written here: the two Python findings reproduced locally were the dev venv's own stale
    # bundled pip/setuptools, not a real project dependency -- confirmed by upgrading them and
    # re-running (0 findings), so that upgrade is an explicit step here rather than trusting
    # whatever pip version happens to ship with actions/setup-python. `--desc off` keeps output short.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev,llm,otel]" # matches the licenses job's own extras choice above
      - run: pip install pip-audit
      - run: pip-audit --desc off
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm audit --omit=dev

  commitlint:
    # Conventional Commits (design doc §11.2): the CHANGELOG and versioning are generated from these.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json
