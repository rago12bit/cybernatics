name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy
      - run: docker build -t bulwark/bandit:1.7.10 docker/bandit
      - run: docker build -t bulwark/semgrep:1.90.0 docker/semgrep
      - run: docker build -t bulwark/trivy:0.55.2 docker/trivy
      - run: docker build -t bulwark/osv-scanner:2.6.0 docker/osv-scanner
      - run: docker build -t bulwark/syft:1.52.0 docker/syft
      - run: docker build -t bulwark/egress-sidecar:1 docker/egress-sidecar
      - run: docker pull ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      - name: Install OPA (plan §20.4 -- policy-as-code)
        run: |
          curl -sL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.21.0/opa_linux_amd64_static
          echo "5eef70644868bb04d0556bcc795ee42f2ab379e73f51d1bfa30f83e1305bc9b9  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa
          opa version
      - run: opa test core/policy/starter
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  zap-baseline:
    # DAST against itself (Week 48 task 2, plan §22.3): the platform running its own baseline
    # scanning tooling against its own web app, in CI, on every push and pull request -- not just
    # something it offers customers. The demo-only build (no API, ADR: web/fly.toml's "public
    # sample site") is the right target: ZAP only needs a real running app to crawl passively, and
    # this one needs no backend to stand up. `-I` treats WARN-level findings as informational for
    # the exit code (only a real FAIL fails the job) -- verified live against this exact build
    # before being written here: 0 FAIL, 4 disclosed WARN categories, all scoped to /_next/static
    # assets that intentionally skip per-request middleware for performance (proxy.ts's own
    # matcher), not unaddressed gaps on any real page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_ONLY: "1"
      - working-directory: web
        run: npx next start -p 3000 &
        env:
          NEXT_PUBLIC_DEMO_ONLY: "1"
      - name: Wait for the app to come up
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && exit 0
            sleep 1
          done
          echo "app never came up" >&2
          exit 1
      - run: mkdir -p "$RUNNER_TEMP/zap"
      - name: ZAP baseline scan
        run: >-
          docker run --rm -v "$RUNNER_TEMP/zap:/zap/wrk:rw" --network host
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py
          -t http://localhost:3000 -r zap-report.html -J zap-report.json -I
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zap-baseline-report
          path: ${{ runner.temp }}/zap/zap-report.html

  e2e:
    # Playwright end-to-end tests for journeys J1 and J3, plus visual regression snapshots (plan
    # §31's quality gates). Real Next.js app + real FastAPI backend (see scripts/e2e_server.py's
    # module docstring for the one thing that's stubbed -- actual scanner containers -- and why),
    # not mocked HTTP. Needs both toolchains: Python for scripts/e2e_server.py, Node for Playwright
    # itself and the app it drives.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tier2-adapters:
    # Heavier scanner images (Grype bakes in its vulnerability database): built separately from the main job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: docker build -t bulwark/grype:0.119.0 docker/grype
      - run: docker build -t bulwark/checkov:3.3.19 docker/checkov
      - run: docker build -t bulwark/gosec:2.29.0 docker/gosec
      - run: docker build -t bulwark/dockle:0.4.15 docker/dockle
      - run: docker build -t bulwark/trivy:0.55.2 docker/trivy
      - run: docker build -t bulwark/osv-scanner:2.6.0 docker/osv-scanner
      - run: pytest tests/unit/test_tier2_adapters.py tests/integration/test_tier2_docker.py --no-cov

  tenancy-rls:
    # The automated cross-tenant leak test ADR-0013 committed to running on every pull request
    # (Week 29 backfill): real Postgres, real Row-Level Security -- the `test` job's SQLite tests
    # only cover application-level filtering, which is belt-and-suspenders, not the real guarantee.
    # pgvector's image, not plain postgres: migration 0002 needs the `vector` extension to exist.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bulwark
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: bulwark
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Migrate as the table-owning role (creates the per-service roles, grants, RLS policies)
        env:
          BULWARK_DATABASE_URL: postgresql://bulwark:ci-owner-password@localhost:5432/bulwark
          APP_DB_PASSWORD: ci-app-password
        run: alembic upgrade head
      - name: Cross-tenant leak test, connected as bulwark_worker -- exactly like the real worker
        # bulwark_app itself is NOLOGIN as of migration 0020 (Week 47 task 3, ADR-0033); its
        # privileges are inherited by bulwark_worker (and bulwark_api/bulwark_fixagent), which is
        # what every real connection uses now. This CI job has no custom mTLS Postgres image or
        # certs, so it authenticates by the same password migration 0020 also sets on these roles
        # for exactly this reason -- production's pg_hba.conf never checks it, only the client cert.
        env:
          BULWARK_RLS_TEST_DATABASE_URL: postgresql+psycopg://bulwark_worker:ci-app-password@localhost:5432/bulwark
        run: >-
          pytest tests/integration/test_tenancy_rls_docker.py
          tests/integration/test_data_protection_rls_docker.py --no-cov

  licenses:
    # Regenerates THIRD_PARTY_LICENSES.md (kept as an artifact) and fails on an unknown or denied license.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[llm,otel]"
      - run: python scripts/gen-licenses.py --check
      - run: python scripts/gen-licenses.py --out "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-licenses
          path: ${{ runner.temp }}/THIRD_PARTY_LICENSES.md

  commitlint:
    # Conventional Commits (design doc §11.2): the CHANGELOG and versioning are generated from these.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
