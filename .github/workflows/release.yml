name: Release

# Builds and publishes the bulwark/app image (the API/worker/migrations image docker-compose.yml
# and a real deployment both run) to GHCR on every version tag, with SLSA Build Level 3 provenance
# (slsa-framework/slsa-github-generator's own reusable container workflow, which a real deployment
# can verify with `slsa-verifier`) and a keyless cosign signature over the image digest -- no stored
# private key, GitHub's own OIDC identity for this workflow run is the signing identity (Week 48
# task 4, plan §22.3).
#
# Disclosed honestly: this workflow has never actually run. Cutting a real release means pushing a
# real container image to a real registry and minting a real public SLSA provenance attestation --
# not something to trigger as a side effect of writing the workflow file, and not something
# reproducible or verifiable from this session without GHCR push access this environment doesn't
# have. The job structure and the generator's required inputs/outputs follow
# slsa-github-generator's own documented contract; see docs/v2-week48-verification.md for exactly
# what remains unverified until a real tag is pushed and this is watched run for real.

on:
  push:
    tags: ["v*"]

permissions: read-all

env:
  IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing identity
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        run: |
          docker build -t "$IMAGE:${{ github.ref_name }}" -f docker/app/Dockerfile .
          docker push "$IMAGE:${{ github.ref_name }}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.ref_name }}" | cut -d'@' -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # SLSA Build Level 3 provenance for the image just pushed. Pinned by TAG, not SHA, deliberately:
  # slsa-github-generator's own documentation requires callers reference a published release tag of
  # this reusable workflow, not an arbitrary commit, since their verification tooling checks the
  # provenance against their own audited releases specifically.
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  sign:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write # cosign's keyless OIDC signing -- no stored private key anywhere
    steps:
      # cosign pushes the signature next to the image, so it needs the registry login the build job
      # had: without it the first real release (v3.0.0, Oct 2026) failed here with UNAUTHORIZED.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"
