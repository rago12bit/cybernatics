name: OpenSSF Scorecard

# Supply-chain security posture, measured and published (Week 48 task 4, plan §22.3). Several of the
# checks Scorecard scores are already real work done earlier this same week, not new for this
# workflow: Fuzzing (.github/workflows/fuzz.yml), Dependency-Update-Tool (.github/dependabot.yml),
# Pinned-Dependencies and Token-Permissions (ci.yml/fuzz.yml's own SHA pins and `permissions:`
# blocks), Security-Policy (SECURITY.md), SAST (ruff/mypy in ci.yml, plus this repo's own self-scan
# in bulwark.yml). Branch-Protection and Signed-Releases are repository/release-process settings
# this workflow cannot create by itself -- see docs/v2-week48-verification.md for what Scorecard
# reports once this has actually run, which this workflow has not, never having been pushed before.

on:
  branch_protection_rule: {}
  schedule:
    - cron: "30 1 * * 6" # weekly, Saturday 01:30 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to Code Scanning
      id-token: write # publish results to the public Scorecard API (so the README badge resolves)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default GITHUB_TOKEN is an "integration" token GitHub's GraphQL API blocks from the
          # commit-history query the Maintained check needs ("Resource not accessible by
          # integration") -- a documented Scorecard limitation, not something this workflow's own
          # permissions block can fix. SCORECARD_READ_TOKEN (a classic PAT, no scopes needed for a
          # public repo) works around it; falls back to GITHUB_TOKEN if that secret isn't set.
          repo_token: ${{ secrets.SCORECARD_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
