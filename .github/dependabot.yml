# Automated dependency updates for Bulwark's own supply chain (Week 48 task 3, plan §22.3, ASVS
# V10 Malicious Code -- the platform scans other projects' dependencies but had no automated update
# process for its own, found during an ASVS self-review). Weekly, grouped, to avoid a flood of
# individual PRs; scripts/gen-licenses.py's own policy check still runs on every PR regardless of
# what triggered it.
#
# Only minor and patch updates are grouped. A major version comes as its own PR: in October 2026 one
# grouped PR carried react-table 9 (a new API) with ten updates that were fine, and failed CI as a
# whole. Type packages follow the runtime they describe, not the newest release: @types/node stays on
# the Node major CI and the Dockerfiles run (22), and @types/vscode on the extension's
# engines.vscode (1.90), which `vsce package` enforces. Move those by hand with the runtime.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message: # "build(deps): bump ..." -- the CI commitlint job wants Conventional Commits
      prefix: "build"
      include: "scope"
    groups:
      # Before the catch-all: a group takes each dependency that matches it first. A linter bump can
      # need a reformat or new type fixes, so it comes apart from the runtime updates.
      python-linters:
        patterns: ["black", "mypy", "ruff"]
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message: # "build(deps): bump ..." -- the CI commitlint job wants Conventional Commits
      prefix: "build"
      include: "scope"
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/extensions/vscode"
    schedule:
      interval: "weekly"
    commit-message: # "build(deps): bump ..." -- the CI commitlint job wants Conventional Commits
      prefix: "build"
      include: "scope"
    groups:
      vscode-extension-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message: # "build(deps): bump ..." -- the CI commitlint job wants Conventional Commits
      prefix: "build"
      include: "scope"

  # Base images and compose images are pinned by digest (docs/THREAT-MODEL.md T10). A digest never
  # changes, so without these the images would never get their own security fixes: Dependabot moves
  # a digest when its tag is rebuilt (a patched python:3.12-slim) as well as a version. Major versions
  # come only by hand (Postgres 16 holds the data; Node 22 is what CI runs), as do Python minors (CI
  # tests 3.12), and Redis stays on 7.2, the last BSD-licensed line (docs/adr/0011-redis-license.md).
  - package-ecosystem: "docker"
    directories: ["/docker/*", "/web"]
    schedule:
      interval: "weekly"
    commit-message: # "build(deps): bump ..." -- the CI commitlint job wants Conventional Commits
      prefix: "build"
      include: "scope"
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message: # "build(deps): bump ..." -- the CI commitlint job wants Conventional Commits
      prefix: "build"
      include: "scope"
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # Built here from docker/ and never published: asking Docker Hub about them fails the run
      # (it answers 401 for a repository that does not exist).
      - dependency-name: "bulwark/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        versions: [">=7.4"]
