<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="ti de">
<title id="ti">Bulwark architecture</title>
<desc id="de">A client submits a Git URL or archive to the FastAPI service, which queues a job in Redis and records it in Postgres. A Celery worker runs five scanners (Bandit, Semgrep, Gitleaks, Trivy, OSV-Scanner) in isolated containers and stores raw output in an S3 store. Adapters normalise results into a canonical finding, correlation merges duplicates, CWE and OWASP mapping and secret redaction follow, and findings are stored in Postgres.</desc>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fd6c2"/></marker></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.bg{fill:#131310} .n{fill:#1c1c18;stroke:#4a4b42;stroke-width:1.2} .g{fill:#17302b;stroke:#7fd6c2;stroke-width:1.4}
.t{fill:#e8e8df;font-size:14px} .s{fill:#9b9c8f;font-size:11px} .l{fill:#9b9c8f;font-size:11px;letter-spacing:.08em}
.z{fill:none;stroke:#4a4b42;stroke-dasharray:5 4} .z2{fill:#161613;stroke:#7fd6c2;stroke-dasharray:5 4}
.a{stroke:#7fd6c2;stroke-width:1.5;fill:none}
</style>
